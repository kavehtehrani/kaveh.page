name: CI

on:
  pull_request:
  push:
    branches: [master]

# Cancel superseded runs on the same branch instead of queueing them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Actions are pinned to commit SHAs rather than tags. A tag like `v5` is
      # mutable and can be repointed at new code, which is the same supply-chain
      # surface that exact-pinned npm deps and .npmrc save-exact close off.
      # Comments record which tag each SHA corresponded to when pinned.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      # `npm ci` fails if package.json and package-lock.json disagree, so this
      # also guards the lockfile staying in sync.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
